<!--
  partials/header.html — единый хедер для всех страниц.

  Активный пункт меню подсвечивается автоматически через
  js/nav-active.js на основе атрибута body[data-page] — самой
  странице вручную ничего указывать не нужно, достаточно,
  чтобы <body data-page="..."> был выставлен правильно.

  Значения data-page на пунктах меню ниже должны совпадать со
  значением body[data-page] той страницы, на которую они ведут:
    home    → index.html
    team    → team.html
    catalog → projects.html
    blog    → blog.html, article.html (любая статья блога)
    contact → contact.html

  WordPress: это будущий header.php. Логотип/меню/телефон/lang-switch/
  auth-иконка переносятся как есть; showPage()-вызовы заменяются на
  обычные ссылки (showPage — легаси одностраничного режима index.html,
  на всех остальных страницах и так используются обычные href).
-->

        <rect width="36" height="36" fill="white"/>
