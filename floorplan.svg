<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <rect width="900" height="600" fill="#f5f5f0"/>
  
  <!-- Title -->
  <text x="450" y="38" font-family="Arial, sans-serif" font-size="18" fill="#444" text-anchor="middle" font-weight="bold">ПЛАНИРОВКА КВАРТИРЫ</text>
  <line x1="60" y1="48" x2="840" y2="48" stroke="#ccc" stroke-width="1"/>

  <!-- Outer walls -->
  <rect x="60" y="60" width="780" height="510" fill="none" stroke="#2c2c2c" stroke-width="8"/>

  <!-- ── LIVING ROOM (left big) ── -->
  <rect x="60" y="60" width="340" height="280" fill="#fff" stroke="#2c2c2c" stroke-width="4"/>
  <text x="230" y="185" font-family="Arial" font-size="15" fill="#555" text-anchor="middle">Гостиная</text>
  <text x="230" y="205" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">28 м²</text>
  <!-- sofa symbol -->
  <rect x="100" y="240" width="120" height="40" rx="4" fill="#ddd" stroke="#aaa" stroke-width="1.5"/>
  <rect x="100" y="240" width="120" height="14" rx="4" fill="#ccc" stroke="#aaa" stroke-width="1"/>
  <!-- table -->
  <rect x="160" y="160" width="60" height="40" rx="3" fill="#e8e8e0" stroke="#bbb" stroke-width="1.5"/>

  <!-- ── BEDROOM 1 (top right) ── -->
  <rect x="400" y="60" width="260" height="230" fill="#fff" stroke="#2c2c2c" stroke-width="4"/>
  <text x="530" y="160" font-family="Arial" font-size="15" fill="#555" text-anchor="middle">Спальня 1</text>
  <text x="530" y="178" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">16 м²</text>
  <!-- bed -->
  <rect x="440" y="75" width="100" height="70" rx="4" fill="#e0e8f0" stroke="#aaa" stroke-width="1.5"/>
  <rect x="440" y="75" width="100" height="20" rx="4" fill="#c8d8e8" stroke="#aaa" stroke-width="1"/>
  <ellipse cx="478" cy="93" rx="12" ry="10" fill="#d0dce8"/>
  <ellipse cx="522" cy="93" rx="12" ry="10" fill="#d0dce8"/>

  <!-- ── BEDROOM 2 (top far right) ── -->
  <rect x="660" y="60" width="180" height="230" fill="#fff" stroke="#2c2c2c" stroke-width="4"/>
  <text x="750" y="160" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">Спальня 2</text>
  <text x="750" y="178" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">12 м²</text>
  <!-- bed -->
  <rect x="685" y="75" width="80" height="60" rx="4" fill="#e0e8f0" stroke="#aaa" stroke-width="1.5"/>
  <rect x="685" y="75" width="80" height="16" rx="4" fill="#c8d8e8" stroke="#aaa" stroke-width="1"/>

  <!-- ── KITCHEN (bottom left) ── -->
  <rect x="60" y="340" width="220" height="230" fill="#fff" stroke="#2c2c2c" stroke-width="4"/>
  <text x="170" y="450" font-family="Arial" font-size="15" fill="#555" text-anchor="middle">Кухня</text>
  <text x="170" y="468" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">14 м²</text>
  <!-- kitchen counter -->
  <rect x="75" y="355" width="190" height="30" rx="3" fill="#e8e0d0" stroke="#bbb" stroke-width="1.5"/>
  <!-- stove circles -->
  <circle cx="110" cy="370" r="10" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="140" cy="370" r="10" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="170" cy="370" r="10" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="200" cy="370" r="10" fill="none" stroke="#999" stroke-width="1.5"/>
  <!-- table -->
  <rect x="90" y="480" width="110" height="60" rx="3" fill="#e8e8e0" stroke="#bbb" stroke-width="1.5"/>

  <!-- ── BATHROOM (bottom center) ── -->
  <rect x="280" y="460" width="160" height="110" fill="#fff" stroke="#2c2c2c" stroke-width="4"/>
  <text x="360" y="510" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">Ванная</text>
  <text x="360" y="526" font-family="Arial" font-size="11" fill="#999" text-anchor="middle">6 м²</text>
  <!-- bathtub -->
  <rect x="293" y="470" width="60" height="34" rx="8" fill="#ddeeff" stroke="#aaa" stroke-width="1.5"/>
  <!-- toilet -->
  <ellipse cx="400" cy="487" rx="14" ry="18" fill="#eee" stroke="#aaa" stroke-width="1.5"/>

  <!-- ── CORRIDOR (center) ── -->
  <rect x="280" y="290" width="380" height="170" fill="#f0ede8" stroke="#2c2c2c" stroke-width="3"/>
  <text x="470" y="378" font-family="Arial" font-size="13" fill="#888" text-anchor="middle">Коридор / Холл</text>
  <text x="470" y="394" font-family="Arial" font-size="11" fill="#bbb" text-anchor="middle">8 м²</text>

  <!-- ── BALCONY ── -->
  <rect x="400" y="530" width="440" height="40" fill="#e8f0e8" stroke="#2c2c2c" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="620" y="555" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Балкон  4 м²</text>

  <!-- doors (arcs) -->
  <!-- living room door -->
  <path d="M280 200 A40 40 0 0 0 320 160" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="280" y1="200" x2="280" y2="160" stroke="#2c2c2c" stroke-width="1.5"/>
  <!-- kitchen door -->
  <path d="M280 390 A35 35 0 0 1 245 355" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="280" y1="390" x2="280" y2="355" stroke="#2c2c2c" stroke-width="1.5"/>
  <!-- bedroom1 door -->
  <path d="M450 290 A35 35 0 0 0 415 255" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="450" y1="290" x2="450" y2="255" stroke="#2c2c2c" stroke-width="1.5"/>

  <!-- compass -->
  <circle cx="830" cy="540" r="22" fill="white" stroke="#ccc" stroke-width="1.5"/>
  <text x="830" y="530" font-family="Arial" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">С</text>
  <line x1="830" y1="534" x2="830" y2="557" stroke="#999" stroke-width="1"/>
  <text x="830" y="562" font-family="Arial" font-size="10" fill="#999" text-anchor="middle">Ю</text>

  <!-- scale -->
  <line x1="70" y1="585" x2="170" y2="585" stroke="#666" stroke-width="2"/>
  <line x1="70" y1="580" x2="70" y2="590" stroke="#666" stroke-width="2"/>
  <line x1="170" y1="580" x2="170" y2="590" stroke="#666" stroke-width="2"/>
  <text x="120" y="598" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">5 м</text>
</svg>
