<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Модерация отзывов — Georgia Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F5F5F5;color:#1A1A2E;min-height:100vh;}
:root{--red:#C0392B;--dark:#1A1A2E;--white:#fff;--gray:#666;--border:#E0E0E0;}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);}
.login-box{background:var(--white);border-radius:12px;padding:40px;width:320px;box-shadow:0 24px 64px rgba(0,0,0,0.25);}
.login-title{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:800;color:var(--dark);margin-bottom:24px;text-align:center;}
.login-box input{width:100%;height:44px;padding:0 14px;border:1.5px solid var(--border);border-radius:8px;font-size:0.875rem;margin-bottom:14px;}
.login-box input:focus{outline:none;border-color:var(--red);}
.login-box button{width:100%;height:44px;background:var(--red);color:var(--white);border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.875rem;}
.login-err{color:var(--red);font-size:0.78rem;margin-bottom:10px;min-height:18px;}

/* Header */
.admin-header{background:var(--dark);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.admin-logo{font-family:'Montserrat',sans-serif;font-size:0.85rem;font-weight:800;color:var(--white);letter-spacing:0.08em;text-transform:uppercase;}
.admin-header-right{display:flex;align-items:center;gap:16px;}
.pending-badge{background:var(--red);color:var(--white);font-size:0.72rem;font-weight:700;padding:3px 9px;border-radius:20px;}
.logout-btn{background:none;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.7);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.8rem;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}

/* Content */
.admin-body{max-width:1100px;margin:0 auto;padding:32px 20px;}
.admin-title{font-family:'Montserrat',sans-serif;font-size:1.4rem;font-weight:800;color:var(--dark);margin-bottom:8px;}
.admin-sub{font-size:0.85rem;color:var(--gray);margin-bottom:24px;}

/* Filter tabs */
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.ftab{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 16px;font-size:0.8rem;cursor:pointer;color:var(--gray);transition:all 0.15s;}
.ftab.active,.ftab:hover{background:var(--dark);color:var(--white);border-color:var(--dark);}

/* Table */
.rev-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.rev-table th{text-align:left;font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);padding:12px 16px;border-bottom:1px solid var(--border);background:#FAFAFA;}
.rev-table td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:0.84rem;vertical-align:top;}
.rev-table tr:last-child td{border-bottom:none;}
.rev-table tr:hover td{background:#FAFAFA;}

.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:0.7rem;font-weight:600;padding:3px 10px;border-radius:20px;}
.s-pending{background:#FFF3CD;color:#856404;}
.s-approved{background:#D1FAE5;color:#065F46;}
.s-rejected{background:#FEE2E2;color:#991B1B;}
.s-reported{background:#EDE9FE;color:#5B21B6;}

.prop-link{color:var(--red);cursor:pointer;text-decoration:none;font-weight:500;}
.prop-link:hover{text-decoration:underline;}

.stars-disp{color:#F39C12;font-size:14px;letter-spacing:1px;}

.text-preview{max-width:300px;color:#444;line-height:1.5;}

.action-btns{display:flex;gap:6px;flex-wrap:wrap;}
.abtn{border:none;border-radius:6px;padding:6px 12px;font-size:0.75rem;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
.abtn:hover{opacity:0.8;}
.abtn-approve{background:#D1FAE5;color:#065F46;}
.abtn-reject{background:#FEE2E2;color:#991B1B;}
.abtn-delete{background:#F3F4F6;color:#374151;}

.empty-state{text-align:center;padding:60px;color:var(--gray);font-size:0.9rem;}
.count-info{font-size:0.85rem;color:var(--gray);margin-bottom:12px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-title">🔒 Модерация отзывов</div>
      <input type="password" id="adminPassInput" placeholder="Пароль администратора" onkeydown="if(event.key==='Enter')adminLogin()">
      <div class="login-err" id="loginErr"></div>
      <button onclick="adminLogin()">Войти</button>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminWrap" style="display:none;">
  <div class="admin-header">
    <div class="admin-logo">Georgia RE · Модерация</div>
    <div class="admin-header-right">
      <span class="pending-badge" id="pendingCount">0 новых</span>
      <button class="logout-btn" onclick="adminLogout()">Выйти</button>
    </div>
  </div>

  <div class="admin-body">
    <div class="admin-title">Отзывы на объекты</div>
    <div class="admin-sub">Проверяйте и публикуйте отзывы пользователей</div>

    <div class="filter-tabs">
      <button class="ftab active" data-filter="all" onclick="setFilter('all',this)">Все</button>
      <button class="ftab" data-filter="pending" onclick="setFilter('pending',this)">Ожидает</button>
      <button class="ftab" data-filter="approved" onclick="setFilter('approved',this)">Одобрен</button>
      <button class="ftab" data-filter="rejected" onclick="setFilter('rejected',this)">Отклонён</button>
      <button class="ftab" data-filter="reported" onclick="setFilter('reported',this)">С жалобой</button>
    </div>

    <div class="count-info" id="countInfo"></div>
    <div id="tableWrap"></div>
  </div>
</div>

<script>
/* ── Reviews storage (inline copy of core logic) ── */
const REV_KEY = 'gre_reviews';
const ADMIN_KEY = 'gre_admin_auth';
const DEFAULT_PASS = 'admin2026';

function loadReviews() {
  try { return JSON.parse(localStorage.getItem(REV_KEY)) || {}; } catch { return {}; }
}
function saveReviews(data) { localStorage.setItem(REV_KEY, JSON.stringify(data)); }

function getAllReviews() {
  const data = loadReviews();
  const all = [];
  Object.keys(data).forEach(propId => {
    (data[propId] || []).forEach(r => all.push({ ...r, propId }));
  });
  return all.sort((a,b) => b.ts - a.ts);
}

function setStatus(id, status) {
  const data = loadReviews();
  Object.keys(data).forEach(pid => {
    data[pid] = data[pid].map(r => r.id === id ? {...r, status} : r);
  });
  saveReviews(data);
  render();
}

function deleteRev(id) {
  if (!confirm('Удалить отзыв?')) return;
  const data = loadReviews();
  Object.keys(data).forEach(pid => {
    data[pid] = data[pid].filter(r => r.id !== id);
  });
  saveReviews(data);
  render();
}

/* ── Auth ── */
function adminLogin() {
  const pass = document.getElementById('adminPassInput').value;
  const stored = localStorage.getItem(ADMIN_KEY) || DEFAULT_PASS;
  if (pass === stored) {
    sessionStorage.setItem('gre_admin_ok', '1');
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminWrap').style.display = '';
    render();
  } else {
    document.getElementById('loginErr').textContent = 'Неверный пароль';
  }
}
function adminLogout() {
  sessionStorage.removeItem('gre_admin_ok');
  location.reload();
}

/* ── Filter ── */
let currentFilter = 'all';
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

/* ── Helpers ── */
function starsHtml(r) {
  return [1,2,3,4,5].map(i => `<span style="color:${i<=r?'#F39C12':'#DDD'}">★</span>`).join('');
}
function fmt(ts) {
  return new Date(ts).toLocaleDateString('ru-RU', {day:'numeric',month:'short',year:'numeric'});
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function statusBadge(r) {
  if (r.reported) return `<span class="status-badge s-reported">⚑ Жалоба</span>`;
  const map = {pending:'s-pending',approved:'s-approved',rejected:'s-rejected'};
  const labels = {pending:'Ожидает',approved:'Одобрен',rejected:'Отклонён'};
  return `<span class="status-badge ${map[r.status]||'s-pending'}">${labels[r.status]||r.status}</span>`;
}

/* ── Render ── */
function render() {
  let all = getAllReviews();
  const pending = all.filter(r => r.status === 'pending');
  document.getElementById('pendingCount').textContent = pending.length + ' новых';

  if (currentFilter === 'reported') all = all.filter(r => r.reported);
  else if (currentFilter !== 'all') all = all.filter(r => r.status === currentFilter);

  document.getElementById('countInfo').textContent = `Показано ${all.length} отзыв${all.length===1?'':'ов'}`;

  if (!all.length) {
    document.getElementById('tableWrap').innerHTML = `<div class="empty-state">Нет отзывов для выбранного фильтра</div>`;
    return;
  }

  const rows = all.map(r => `
    <tr>
      <td>
        <a class="prop-link" href="index.html?prop=${r.propId}" target="_blank">${escHtml(r.propId)}</a>
      </td>
      <td style="white-space:nowrap;">${escHtml(r.userName)}<br><span style="font-size:0.72rem;color:#999;">${escHtml(r.userEmail)}</span></td>
      <td><div style="font-size:16px;">${starsHtml(r.rating)}</div></td>
      <td><div class="text-preview">${escHtml(r.text.slice(0,200))}${r.text.length>200?'…':''}</div></td>
      <td style="white-space:nowrap;">${fmt(r.ts)}</td>
      <td>${statusBadge(r)}</td>
      <td>
        <div class="action-btns">
          ${r.status !== 'approved' ? `<button class="abtn abtn-approve" onclick="setStatus('${r.id}','approved')">✓ Одобрить</button>` : ''}
          ${r.status !== 'rejected' ? `<button class="abtn abtn-reject" onclick="setStatus('${r.id}','rejected')">✗ Отклонить</button>` : ''}
          <button class="abtn abtn-delete" onclick="deleteRev('${r.id}')">🗑</button>
        </div>
      </td>
    </tr>`).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table class="rev-table">
      <thead><tr>
        <th>Объект</th><th>Автор</th><th>Оценка</th><th>Текст</th><th>Дата</th><th>Статус</th><th>Действия</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

/* ── Init ── */
if (sessionStorage.getItem('gre_admin_ok') === '1') {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('adminWrap').style.display = '';
  render();
}
</script>
</body>
</html>
